<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stradar">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"></stop>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"></stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="47" fill="none" stroke="#6366f1" stroke-width="3" filter="url(#glow)"></circle>

  <circle cx="50" cy="50" r="34" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.85" stroke-dasharray="4 5"></circle>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#6366f1" stroke-width="1.6" stroke-opacity="0.7" stroke-dasharray="3 6"></circle>

  <line x1="50" y1="10" x2="50" y2="22" stroke="#6366f1" stroke-opacity="0.9" stroke-width="1.5"></line>
  <line x1="10" y1="50" x2="22" y2="50" stroke="#6366f1" stroke-opacity="0.9" stroke-width="1.5"></line>
  <line x1="78" y1="50" x2="90" y2="50" stroke="#6366f1" stroke-opacity="0.9" stroke-width="1.5"></line>

  <g transform="translate(50,50)">
    <path d="M0 0 L40 0 A40 40 0 0 1 0 40 Z" fill="url(#sweep)" transform="rotate(18)"></path>
    <circle cx="24" cy="-18" r="3" fill="#6366f1" filter="url(#glow)"></circle>
  </g>
</svg>
